name: ci

# The gate a consumer's pinned SHA rests on: a consumer installs hera as a git dep at a
# commit, so that commit must have passed typecheck, lint, tests and the secret scan here.
#
# The same workflow ships in the public repo. A private repo runs on the org's self-hosted
# runners; a public repo (and every fork of it) runs on GitHub-hosted ones, so a fork's pull
# request never reaches a self-hosted machine.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ github.event.repository.private && 'sib-8vcpu' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      # `bun run lint` and test/skill-and-rules.test.ts run `ast-grep scan` and `ast-grep test`
      # over the ruleset; the same pinned build and checksum as the org lint gate.
      - name: Install ast-grep
        env:
          AST_GREP_VERSION: 0.50.0
          AST_GREP_CHECKSUM: 0fd3f489639abb8465a914b74b8779171577582318d8a940d00399f59dba81c5
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/ast-grep.zip" \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          echo "${AST_GREP_CHECKSUM}  ${RUNNER_TEMP}/ast-grep.zip" | sha256sum -c -
          unzip -q -d "${RUNNER_TEMP}" "${RUNNER_TEMP}/ast-grep.zip" ast-grep
          sudo install -m 0755 "${RUNNER_TEMP}/ast-grep" /usr/local/bin/ast-grep
          ast-grep --version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  # The tree `git archive` ships (.gitattributes `export-ignore` applied), scanned with the
  # default gitleaks rules; .gitleaks.toml allowlists each test fixture by its exact value.
  secrets:
    runs-on: ${{ github.event.repository.private && 'sib-8vcpu' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CHECKSUM: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_CHECKSUM}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          sudo install -m 0755 "${RUNNER_TEMP}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the archived tree
        run: |
          set -euo pipefail
          tree="${RUNNER_TEMP}/tree"
          mkdir -p "${tree}"
          git archive HEAD | tar -x -C "${tree}"
          gitleaks dir "${tree}" --config .gitleaks.toml --redact --no-banner

  # Packs the npm tarball, checks `npm publish --dry-run` on an unpacked synthetic version,
  # and installs the tarball into an isolated consumer directory to verify subpath exports.
  npm-pack:
    runs-on: ${{ github.event.repository.private && 'sib-8vcpu' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Pack and dry-run publish
        id: pack
        run: |
          set -euo pipefail
          tarball=$(npm pack --ignore-scripts --silent --pack-destination "${RUNNER_TEMP}")
          echo "tarball=${RUNNER_TEMP}/${tarball}" >>"$GITHUB_OUTPUT"
          dry="${RUNNER_TEMP}/dry-run"
          mkdir -p "${dry}"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${dry}"
          cd "${dry}/package"
          npm version 0.0.0-ci-dry-run --no-git-tag-version --ignore-scripts --allow-same-version
          npm publish --dry-run --ignore-scripts --tag ci-dry-run
      - name: Install tarball in an isolated consumer and resolve subpaths
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/consumer"
          mkdir -p "${app}"
          cd "${app}"
          printf '{"name":"consumer","private":true,"type":"module","dependencies":{"@sibylline-labs/hera":"file:%s","effect":"4.0.6"}}\n' "${TARBALL}" > package.json
          bun install
          cat > check.ts <<'TS'
          import { HeraError } from "@sibylline-labs/hera/core";
          import { HeraSchema } from "@sibylline-labs/hera/schema";
          import { defineVerb } from "@sibylline-labs/hera/cli/manifest";
          import { HeraTui } from "@sibylline-labs/hera/tui";
          import { HeraTest } from "@sibylline-labs/hera/testing";
          if (typeof HeraError.notFound !== "function" || typeof HeraSchema.decode !== "function") {
            throw new Error("core or schema subpath did not resolve");
          }
          if (typeof defineVerb !== "function" || typeof HeraTui.run !== "function" || typeof HeraTest.runTest !== "function") {
            throw new Error("cli/manifest, tui or testing subpath did not resolve");
          }
          console.log("resolved @sibylline-labs/hera subpaths from tarball");
          TS
          bun check.ts
